<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Loading Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        h1 {
            color: #4CAF50;
        }
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
        .status-card {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #666;
        }
        .status-card.loading {
            border-left-color: #2196F3;
        }
        .status-card.success {
            border-left-color: #4CAF50;
        }
        .status-card.error {
            border-left-color: #f44336;
        }
        .status-card.warning {
            border-left-color: #ff9800;
        }
        .status-card h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
        }
        .status-card .status {
            font-size: 14px;
            opacity: 0.8;
        }
        .console {
            background: #000;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            max-height: 400px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin: 20px 0;
        }
        .console-line {
            margin: 2px 0;
            padding: 2px 0;
        }
        .console-line.error {
            color: #f44336;
        }
        .console-line.success {
            color: #4CAF50;
        }
        .console-line.warning {
            color: #ff9800;
        }
        .console-line.info {
            color: #2196F3;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px 10px 10px 0;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #666;
            cursor: not-allowed;
        }
        .summary {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .summary h2 {
            margin-top: 0;
            color: #4CAF50;
        }
        .summary-stats {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
        }
        .stat {
            flex: 1;
            min-width: 150px;
        }
        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #4CAF50;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>🔬 Model Loading Diagnostic Test</h1>
    <p>This page tests if all model loading fixes are working correctly.</p>
    
    <div>
        <button id="testBtn" onclick="runTests()">▶️ Run Tests</button>
        <button onclick="clearCache()">🗑️ Clear IndexedDB Cache</button>
        <button onclick="clearConsole()">🧹 Clear Console</button>
    </div>

    <div class="summary" id="summary" style="display: none;">
        <h2>📊 Test Summary</h2>
        <div class="summary-stats">
            <div class="stat">
                <div class="stat-value" id="successCount">0</div>
                <div class="stat-label">Models Loaded</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="failCount">0</div>
                <div class="stat-label">Failed</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="totalTime">0s</div>
                <div class="stat-label">Total Time</div>
            </div>
        </div>
    </div>

    <div class="status-grid" id="statusGrid"></div>

    <div class="console" id="console">
        <div class="console-line info">🎯 Ready to test. Click "Run Tests" to begin.</div>
        <div class="console-line info">💡 Make sure to clear IndexedDB cache before testing!</div>
    </div>

    <script>
        const models = [
            { id: 'opencv', name: 'OpenCV.js', type: 'preprocessing' },
            { id: 'faceDetection', name: 'MediaPipe Face Detection', type: 'mediapipe' },
            { id: 'faceLandmarker', name: 'MediaPipe Face Landmarker', type: 'mediapipe' },
            { id: 'vitDeepfakeExp', name: 'ViT-Deepfake-Exp', type: 'onnx', size: '343 MB' },
            { id: 'vitDeepfakeV2', name: 'ViT-Deepfake-V2', type: 'onnx', size: '343 MB' },
            { id: 'deepfakeDetector', name: 'DeepfakeDetector', type: 'onnx', size: '95 MB' },
            { id: 'aiDetector', name: 'AI Detector', type: 'onnx', size: '322 MB' },
            { id: 'efficientnetB4', name: 'EfficientNet-B4', type: 'onnx', size: '71 MB' },
            { id: 'xceptionNet', name: 'Xception Net', type: 'onnx', size: '3.9 MB' },
            { id: 'resnet50', name: 'ResNet50', type: 'onnx', size: '94 MB' },
            { id: 'mobilenet', name: 'MobileNetV2', type: 'tfjs' },
            { id: 'mesonet', name: 'MesoNet4 (Optional)', type: 'tfjs', optional: true },
        ];

        let successCount = 0;
        let failCount = 0;
        let startTime = 0;

        function log(message, type = 'info') {
            const console = document.getElementById('console');
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            console.appendChild(line);
            console.scrollTop = console.scrollHeight;
            
            // Also log to browser console
            const logFn = type === 'error' ? console.error : type === 'warning' ? console.warn : console.log;
            logFn(message);
        }

        function updateModelStatus(id, status, message = '') {
            let card = document.getElementById(`card-${id}`);
            if (!card) {
                card = document.createElement('div');
                card.id = `card-${id}`;
                card.className = 'status-card loading';
                const model = models.find(m => m.id === id);
                card.innerHTML = `
                    <h3>${model.name}${model.size ? ` (${model.size})` : ''}</h3>
                    <div class="status" id="status-${id}">Waiting...</div>
                `;
                document.getElementById('statusGrid').appendChild(card);
            }
            
            card.className = `status-card ${status}`;
            document.getElementById(`status-${id}`).textContent = message;
        }

        function updateSummary() {
            const totalTime = ((Date.now() - startTime) / 1000).toFixed(1);
            document.getElementById('summary').style.display = 'block';
            document.getElementById('successCount').textContent = successCount;
            document.getElementById('failCount').textContent = failCount;
            document.getElementById('totalTime').textContent = `${totalTime}s`;
        }

        async function clearCache() {
            log('🗑️ Clearing IndexedDB cache...', 'info');
            try {
                const dbs = await indexedDB.databases();
                for (const db of dbs) {
                    if (db.name === 'onnx-model-cache') {
                        await new Promise((resolve, reject) => {
                            const req = indexedDB.deleteDatabase(db.name);
                            req.onsuccess = resolve;
                            req.onerror = reject;
                        });
                        log(`✅ Deleted database: ${db.name}`, 'success');
                    }
                }
                log('✅ Cache cleared successfully!', 'success');
            } catch (error) {
                log(`❌ Failed to clear cache: ${error.message}`, 'error');
            }
        }

        function clearConsole() {
            document.getElementById('console').innerHTML = '';
            log('Console cleared', 'info');
        }

        async function testModelLoading(modelId, testFn) {
            updateModelStatus(modelId, 'loading', 'Loading...');
            try {
                await testFn();
                updateModelStatus(modelId, 'success', '✅ Loaded successfully');
                successCount++;
                return true;
            } catch (error) {
                const model = models.find(m => m.id === modelId);
                if (model.optional) {
                    updateModelStatus(modelId, 'warning', `⚠️ Optional: ${error.message}`);
                    log(`⚠️ ${model.name} (optional): ${error.message}`, 'warning');
                } else {
                    updateModelStatus(modelId, 'error', `❌ ${error.message}`);
                    log(`❌ ${model.name} failed: ${error.message}`, 'error');
                    failCount++;
                }
                return false;
            }
        }

        async function runTests() {
            const btn = document.getElementById('testBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Running Tests...';
            
            successCount = 0;
            failCount = 0;
            startTime = Date.now();
            
            document.getElementById('statusGrid').innerHTML = '';
            log('🚀 Starting model loading tests...', 'info');
            log('', 'info');

            // Note: This is a diagnostic page - actual testing requires
            // the app to be running. This page just helps visualize what
            // should happen.
            
            log('📋 Test Plan:', 'info');
            log('  1. Check for ONNX model files', 'info');
            log('  2. Verify MediaPipe CDN accessibility', 'info');
            log('  3. Check IndexedDB support', 'info');
            log('  4. Validate file paths', 'info');
            log('', 'info');

            // Test 1: Check ONNX model files
            log('🔍 Checking ONNX model files...', 'info');
            const onnxModels = models.filter(m => m.type === 'onnx');
            for (const model of onnxModels) {
                await testModelLoading(model.id, async () => {
                    const paths = [
                        `/models/onnx/${model.id.replace(/([A-Z])/g, '_$1').toLowerCase().replace(/^_/, '')}.onnx`
                    ];
                    
                    // Check if file exists
                    const response = await fetch(paths[0], { method: 'HEAD' });
                    if (!response.ok) throw new Error(`File not found: ${paths[0]}`);
                    
                    const size = response.headers.get('content-length');
                    log(`  ✓ ${model.name}: ${size ? (size / 1024 / 1024).toFixed(2) + ' MB' : 'found'}`, 'success');
                });
            }

            // Test 2: Check MediaPipe
            log('', 'info');
            log('🔍 Checking MediaPipe accessibility...', 'info');
            await testModelLoading('faceDetection', async () => {
                const response = await fetch('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm/vision_wasm_internal.js', { method: 'HEAD' });
                if (!response.ok) throw new Error('MediaPipe CDN unreachable');
                log('  ✓ MediaPipe WASM accessible', 'success');
            });

            // Test 3: Check IndexedDB
            log('', 'info');
            log('🔍 Checking IndexedDB support...', 'info');
            if (typeof indexedDB !== 'undefined') {
                log('  ✓ IndexedDB supported', 'success');
                updateModelStatus('cache', 'success', '✅ Supported');
            } else {
                log('  ✗ IndexedDB not supported', 'error');
                updateModelStatus('cache', 'error', '❌ Not supported');
                failCount++;
            }

            log('', 'info');
            log('✅ Diagnostic tests complete!', 'success');
            log('', 'info');
            log('📝 Next Steps:', 'info');
            log('  1. Clear browser cache (Ctrl+Shift+Del)', 'info');
            log('  2. Delete IndexedDB cache (Application tab)', 'info');
            log('  3. Hard refresh the main app (Ctrl+Shift+R)', 'info');
            log('  4. Navigate to /detect page', 'info');
            log('  5. Watch console for model loading', 'info');

            updateSummary();
            btn.disabled = false;
            btn.textContent = '▶️ Run Tests Again';
        }

        // Initialize status cards
        window.addEventListener('load', () => {
            log('📦 Model Loading Diagnostic Tool', 'info');
            log('', 'info');
            log('This page helps diagnose model loading issues.', 'info');
            log('Run tests to check if all fixes are in place.', 'info');
            log('', 'info');
        });
    </script>
</body>
</html>
